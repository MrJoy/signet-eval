name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Formatting
        run: cargo +stable fmt --all --check
      - name: Tests with MCP
        run: cargo +stable test --workspace --locked
      - name: Tests without MCP
        run: cargo +stable test --workspace --locked --no-default-features
      - name: Release binary
        run: cargo +stable build --release --locked
      - name: Verify packaged source and embedded adapter
        run: cargo +stable package --locked
